version: 2

models:
  - name: dim_shipper
    description: "One row per shipper name. shipper_key is an md5 surrogate key."
    columns:
      - name: shipper_key
        tests: [not_null, unique]
      - name: shipper_name
  - name: dim_carrier
    description: "One row per carrier name, including an unknown/null member."
    columns:
      - name: carrier_key
        tests: [not_null, unique]
      - name: carrier_name
  - name: dim_lane
    description: "One row per unique origin-destination lane with parsed locations and haul type."
    columns:
      - name: lane_key
        tests: [not_null, unique]
      - name: lane
        tests: [not_null, unique]
      - name: haul_type
        description: "Intrastate when pickup_state equals delivery_state; interstate otherwise."
  - name: dim_date
    description: "Calendar dimension spanning the date range represented by the load lifecycle."
    columns:
      - name: date_day
        tests: [not_null, unique]
